<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280" text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">
  <defs>
    <!-- Premium Deep Obsidian Gradient (Linear/Vercel Aesthetic) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="45%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Ultra High-Contrast Name Gradient (White to Vivid Electric Cyan) -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F0F9FF"/>
      <stop offset="85%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Mesh Radial Glows -->
    <radialGradient id="meshGlowLeft" cx="15%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlowRight" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Premium Tech Dot Matrix -->
    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#nameGrad);
      letter-spacing: -0.8px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.8px;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.3px;
    }
    .role-brand {
      fill: #38BDF8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #CBD5E1;
      letter-spacing: 0.1px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="280" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Ambient Ambient Lighting -->
  <rect width="1000" height="280" rx="18" fill="url(#meshGlowLeft)"/>
  <rect width="1000" height="280" rx="18" fill="url(#meshGlowRight)"/>

  <!-- Dot Matrix Overlay -->
  <rect width="1000" height="280" rx="18" fill="url(#dotMatrix)"/>

  <!-- Top Edge Light Line (Apple/Vercel Gloss Highlight) -->
  <path d="M 30 1 L 970 1" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Status Pill -->
  <g transform="translate(60, 36)">
    <rect width="280" height="30" rx="15" fill="#0B132B" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#00E5FF"/>
    <text x="32" y="19.5" class="badge-pill-text">FULL-STACK DEVELOPER · DREMOY</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(60, 116)">
    <text x="0" y="0" class="title">Hi, I'm Furkan Ahmed 👋</text>
  </g>

  <!-- Role Subheading (High-Contrast Pure White & Cyan Brand) -->
  <g transform="translate(60, 154)">
    <text x="0" y="0" class="role-title">Full-Stack Web Developer <tspan fill="#64748B">·</tspan> <tspan class="role-brand">Founder of Dremoy</tspan></text>
  </g>

  <!-- Tagline Subtext -->
  <g transform="translate(60, 186)">
    <text x="0" y="0" class="tagline-text">Building real-world web applications · Fast, honest learner eager to grow with guidance</text>
  </g>

  <!-- Tech Stack Badges (Bottom Row with Color Accent Dots) -->
  <g transform="translate(60, 218)">
    <!-- React -->
    <rect x="0" y="0" width="88" height="30" rx="8" fill="url(#glassPill)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#38BDF8"/>
    <text x="27" y="20" class="pill-label">React</text>

    <!-- Next.js -->
    <rect x="98" y="0" width="98" height="30" rx="8" fill="url(#glassPill)" stroke="#A5B4FC" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="113" cy="15" r="4" fill="#A5B4FC"/>
    <text x="125" y="20" class="pill-label">Next.js</text>

    <!-- JavaScript -->
    <rect x="206" y="0" width="118" height="30" rx="8" fill="url(#glassPill)" stroke="#FBBF24" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="221" cy="15" r="4" fill="#FBBF24"/>
    <text x="233" y="20" class="pill-label">JavaScript</text>

    <!-- Tailwind -->
    <rect x="334" y="0" width="102" height="30" rx="8" fill="url(#glassPill)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="349" cy="15" r="4" fill="#38BDF8"/>
    <text x="361" y="20" class="pill-label">Tailwind</text>

    <!-- Laravel -->
    <rect x="446" y="0" width="96" height="30" rx="8" fill="url(#glassPill)" stroke="#F43F5E" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="461" cy="15" r="4" fill="#F43F5E"/>
    <text x="473" y="20" class="pill-label">Laravel</text>

    <!-- Supabase -->
    <rect x="552" y="0" width="108" height="30" rx="8" fill="url(#glassPill)" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="567" cy="15" r="4" fill="#34D399"/>
    <text x="579" y="20" class="pill-label">Supabase</text>
  </g>

  <!-- Right Decorative Element: High-Tech Code Terminal Emblem -->
  <g transform="translate(760, 48)">
    <!-- Outer Glow Rings -->
    <circle cx="95" cy="95" r="82" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.8"/>
    <circle cx="95" cy="95" r="62" fill="#0B132B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Code Brackets & Slash (Vivid Neon Colors) -->
    <path d="M 76 83 L 64 95 L 76 107" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 114 83 L 126 95 L 114 107" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 101 78 L 89 112" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
