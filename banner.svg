<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <!-- Text Gradient for Name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Tech Grid Background -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#nameGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      fill: #93c5fd;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-size: 12.5px;
      font-weight: 700;
      fill: #ffffff;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Ambient Light Effects -->
  <rect width="1000" height="240" rx="16" fill="url(#glow1)"/>
  <rect width="1000" height="240" rx="16" fill="url(#glow2)"/>

  <!-- Tech Grid -->
  <rect width="1000" height="240" rx="16" fill="url(#grid)"/>

  <!-- Top Pill: Dremoy Brand & Developer -->
  <g transform="translate(60, 34)">
    <rect width="260" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8"/>
    <text x="30" y="18.5" class="badge-text">FULL-STACK DEVELOPER · DREMOY</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(60, 106)">
    <text x="0" y="0" class="title">Hi, I'm Furkan Ahmed 👋</text>
  </g>

  <!-- Role Subheading (Crisp Bold White) -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="role-text">Full-Stack Web Developer · Founder of Dremoy</text>
  </g>

  <!-- Tagline Subtext (Crisp Light Blue) -->
  <g transform="translate(60, 168)">
    <text x="0" y="0" class="tagline-text">Building real-world web applications · Fast, honest learner eager to grow with guidance</text>
  </g>

  <!-- Tech Pills (Bottom) -->
  <g transform="translate(60, 192)">
    <!-- Pill 1: React -->
    <rect x="0" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="14" y="17.5" class="pill-text">React</text>

    <!-- Pill 2: Next.js -->
    <rect x="86" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="98" y="17.5" class="pill-text">Next.js</text>

    <!-- Pill 3: JavaScript -->
    <rect x="182" y="0" width="104" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="194" y="17.5" class="pill-text">JavaScript</text>

    <!-- Pill 4: Tailwind -->
    <rect x="296" y="0" width="92" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="308" y="17.5" class="pill-text">Tailwind</text>

    <!-- Pill 5: Laravel -->
    <rect x="398" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="410" y="17.5" class="pill-text">Laravel</text>

    <!-- Pill 6: Supabase -->
    <rect x="494" y="0" width="98" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="506" y="17.5" class="pill-text">Supabase</text>
  </g>

  <!-- Right Decorative Element: Modern Orbiting Tech Graphic -->
  <g transform="translate(770, 36)" opacity="0.9">
    <circle cx="90" cy="84" r="72" fill="none" stroke="url(#nameGrad)" stroke-width="1.8" stroke-dasharray="6 6"/>
    <circle cx="90" cy="84" r="52" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 74 74 L 62 84 L 74 94" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 106 74 L 118 84 L 106 94" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95 68 L 85 100" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
